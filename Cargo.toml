[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace]
members = ["net-ext", "sslgame", "xrvis-desktop", "xrvis-vr"]
resolver = "3"

[workspace.dependencies]
net-ext = { path = "net-ext" }
sslgame = { path = "sslgame" }

bevy = "0.20.0"
bevy_mod_openxr = { git = "https://github.com/awtterpip/bevy_oxr.git", rev = "ce6799dbca9d80f2a658d39ad6ac4dc58c2fdc0d", features = ["fb_passthrough"] }
bevy_mod_xr = { git = "https://github.com/awtterpip/bevy_oxr.git", rev = "ce6799dbca9d80f2a658d39ad6ac4dc58c2fdc0d" }
schminput = { git = "https://github.com/MaximilianHausen/Schminput.git", rev = "b4ef651d01aa06465f8cee6b84c62540a6f8202c", features = ["xr"] }

bytes = "1.12.1"
derive_more = "2.1.1"
tracing = "*" # Matching bevy's version, just for the #[instrument] macro

earcut = "0.4.11"
lucide-icons = "1.35.0"

async-channel = "2.5.0"
async-io = "2.6.0"
async-net = "2.0.0"
async-tungstenite = "0.35.0"

network-interface = "2.0.5"
prost = "0.14.4"
prost-build = "0.14.4"
socket2 = "0.6.5"

libc = "0.2.189"
windows-sys = { version = "0.61.2", features = ["Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

# Prioritize iteration times for our code, but enable optimizations for all dependencies
[profile.dev.package]
net-ext.opt-level = 1
sslgame.opt-level = 1
xrvis-desktop.opt-level = 1
xrvis-vr.opt-level = 1
"*".opt-level = 3

[profile.release]
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true
