syntax = "proto2";

package remote;

message FieldGeometry {
    required float field_size_x = 1;
    required float field_size_y = 2;
    optional float boundary_width = 3;
    optional float defense_size_x = 4;
    optional float defense_size_y = 5;
    optional float goal_width = 6;
}

message GameState {
    optional string game_stage = 1;
    optional TeamState yellow_team = 2;
    optional TeamState blue_team = 3;
}

message TeamState {
    optional string name = 1;
    optional uint32 score = 2;
    optional uint32 fouls = 3;
    optional uint32 yellow_cards = 4;
    optional uint32 red_cards = 5;
}

// ==== World State ====

message WorldState {
    // Monotonic microsecond timestamp used for client-side state filtering and buffer time adjustments
    optional uint64 timestamp = 1;
    repeated Ball ball = 2;
    repeated Robot yellow_robot = 3;
    repeated Robot blue_robot = 4;
}

message Robot {
    required uint32 id = 1;
    required float p_x = 2;
    required float p_y = 3;
    required float phi = 4;
}

message Ball {
    required float p_x = 1;
    required float p_y = 2;
    optional float p_z = 3;
}

// ==== Visualizations ====

// Structural model of all currently known visualizations from all sources
message VisModel {
    repeated VisSourceSkeleton groups = 1;
}

// Structural information about a single visualization source
message VisSourceSkeleton {
    required string name = 1;
    // All currently known visualizations for this source
    repeated VisSkeleton visualizations = 2;
}

// Structural information about a single visualization
message VisSkeleton {
    // Id of this visualization. Uniquely identifies it across all sources, even against similar names.
    // Having this id be fully unique has multiple advantages for the regular [VisualizationUpdate]s:
    // - Only one id is required to associate a [VisualizationData] with its [VisSkeleton], saving a bit of space
    // - If the id for a given name would be the same from all sources, then they would all end up in the same
    //  update group, and the [VisGroupSelector] would not be able to split a big visualization across multiple packets.
    //  Having them be fully unique means that the parts from different sources can end up in different groups,
    //  spreading the network load more evenly.
    required uint32 id = 1;
    required string name = 2;
}

// Regular update containing filtered data for the latest [VisualizationModel]
message VisualizationUpdate {
    // The visualization group this update applies to. No vis group means the update includes all visualizations.
    // Used to split vis updates across multiple frames to reduce data sizes.
    optional VisGroupSelector group_selector = 1;
    // Detailed shape data for all active visualizations that pass the [VisualizationFilter].
    repeated VisualizationData active_vis = 2;
    // Compact list of all active visualizations that failed the [VisualizationFilter].
    // Used to highlight active visualizations in the UI, even if they aren't selected.
    repeated uint32 hidden_active_vis = 3 [packed = true];
}

// An update packet with a group selector contains all visualizations where `vis_id % group_count == group`
message VisGroupSelector {
    // This update's group
    required uint32 group = 1;
    // Total number of groups. May be changed dynamically based on network performance.
    required uint32 group_count = 2;
}

message VisualizationData {
    // Compact id of this visualization, referencing the latest [VisModel]
    required uint32 id = 1;
    repeated VisShape shape = 2;
}

// ==== Visualization shapes ====

message VisShape {
    optional BorderStyle border_style = 1;
    optional Color fill_color = 2;
    oneof geom {
        Circle circle = 3;
        Polygon polygon = 4;
        Path path = 5;
    }
}

message BorderStyle {
    enum Style {
        DashLine = 1;
        DotLine = 2;
        DashDotLine = 3;
        DashDotDotLine = 4;
    }

    optional Style style = 1;
    optional Color color = 2;
    optional float width = 3;
}

message Color {
    required uint32 red = 1 [default = 0];
    required uint32 green = 2 [default = 0];
    required uint32 blue = 3 [default = 0];
    required uint32 alpha = 4 [default = 255];
}

message Point {
    required float x = 1;
    required float y = 2;
}

message Circle {
    required Point center = 1;
    required float radius = 2;
}

message Polygon {
    repeated Point point = 1;
}

message Path {
    repeated Point point = 1;
}
