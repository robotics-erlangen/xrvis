syntax = "proto2";

package remote;

message FieldGeometry {
    required float field_size_x = 1;
    required float field_size_y = 2;
    optional float boundary_width = 3;
    optional float defense_size_x = 4;
    optional float defense_size_y = 5;
    optional float goal_width = 6;
}

message GameState {
    optional string game_stage = 1;
    optional TeamState yellow_team = 2;
    optional TeamState blue_team = 3;
}

message TeamState {
    optional string name = 1;
    optional uint32 score = 2;
    optional uint32 fouls = 3;
    optional uint32 yellow_cards = 4;
    optional uint32 red_cards = 5;
}

// Human-readable names for the ids used in regular visualization updates
message VisMappings {
    map<uint32, string> source = 1;
    map<uint32, string> name = 2;
}

// ==== World State ====

message WorldState {
    // Timestamp used for client-side state filtering and buffer time adjustments
    optional uint64 timestamp = 1;
    repeated Ball ball = 2;
    repeated Robot yellow_robot = 3;
    repeated Robot blue_robot = 4;
}

message Robot {
    required uint32 id = 1;
    required float p_x = 2;
    required float p_y = 3;
    required float phi = 4;
}

message Ball {
    required float p_x = 1;
    required float p_y = 2;
    optional float p_z = 3;
}

// ==== Visualizations ====

message VisualizationUpdate {
    // The visualization group this update applies to. No vis group means the update includes all visualizations.
    // Used to split vis updates across multiple frames to reduce data sizes.
    optional VisGroupSelector group_selector = 1;
    // All current visualizations in this group. Any old visualizations matching the group selector will be removed.
    repeated VisualizationSet visualization_set = 2;
}

// An update packet with a group selector contains all visualizations where `vis_id % group_count == group`
message VisGroupSelector {
    // This update's group
    required uint32 group = 1;
    // Total number of groups. May be changed dynamically based on network performance.
    required uint32 group_count = 2;
}

// Collection of visualizations from a single source
message VisualizationSet {
    // Shorthand source id, a human readable name is included in the VisMappings (e.g. strategy_blue, autoref, ...).
    optional uint32 source = 1;
    repeated Visualization visualization = 2;
}

message Visualization {
    // Shorthand vis id, a human readable name is included in the VisMappings. Also used to assign this visualization to a group.
    required uint32 id = 1;
    // Standard visualisation shapes
    repeated VisShape shape = 2;
    // Optional implementation-defined theme for more drastic styling changes (e.g. simple, hologram, ...)
    optional string shape_theme = 3;
    // Implementation-defined custom assets
    repeated VisAsset asset = 4;
}

// ==== Visualization shapes ====

message VisShape {
    optional BorderStyle border_style = 1;
    optional Color fill_color = 2;
    oneof geom {
        Circle circle = 3;
        Polygon polygon = 4;
        Path path = 5;
    }
}

message BorderStyle {
    enum Style {
        DashLine = 1;
        DotLine = 2;
        DashDotLine = 3;
        DashDotDotLine = 4;
    }

    optional Style style = 1;
    optional Color color = 2;
    optional float width = 3;
}

message Color {
    required uint32 red = 1 [default = 0];
    required uint32 green = 2 [default = 0];
    required uint32 blue = 3 [default = 0];
    required uint32 alpha = 4 [default = 255];
}

message Point {
    required float x = 1;
    required float y = 2;
}

message Circle {
    required Point center = 1;
    required float radius = 2;
}

message Polygon {
    repeated Point point = 1;
}

message Path {
    repeated Point point = 1;
}

// ==== Asset visualizations ====

message VisAsset {
    // Included directly without a VisMapping-like indirection because the string content is essential to using the data.
    required string path = 1;
    optional Point pos = 2;
    optional float angle = 3;
    // Currently looping animation
    optional string animation = 4;
}
